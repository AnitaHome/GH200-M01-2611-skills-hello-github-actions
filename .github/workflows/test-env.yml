name: Test Env Scope Hierarchy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# 1. Workflow 層級（全域預設）
env:
  APP_ENV: "global-default"

jobs:
  # Job A：沒有設定 Job 層級 env，會吃到 Workflow 層級的值
  test-workflow-level:
    runs-on: ubuntu-latest
    steps:
      - name: Read Workflow Env
        run: |
          echo "Current env: $APP_ENV"

  # Job B：有設定 Job 層級與 Step 層級 env，展示覆蓋效果
  test-override-levels:
    runs-on: ubuntu-latest
    # 2. Job 層級（覆蓋 Workflow 層，僅此 Job 有效）
    env:
      APP_ENV: "job-override"
    steps:
      - name: Step 1 (Step 層覆蓋)
        # 3. Step 層級（覆蓋 Job 層，僅此 Step 有效）
        env:
          APP_ENV: "step-only"
        run: |
          echo "Current env: $APP_ENV"

      - name: Step 2 (回到 Job 層)
        run: |
          echo "Current env: $APP_ENV"
